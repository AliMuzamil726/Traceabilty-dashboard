[project]
name = "sawie-backend"
version = "0.1.0"
description = "SAWIE fibre-crop traceability platform - backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "module_1", "module_2", "module_3", "module_4", "module_5", "module_6", "module_7", "module_8"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "data", "storage", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "BLE", "RUF", "C4", "PT"]
ignore = ["B008"]  # FastAPI dependencies are declared as default arguments

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "shared", "scripts", "module_1", "module_2", "module_3", "module_4", "module_5", "module_6", "module_7", "module_8"]
